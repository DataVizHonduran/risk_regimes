name: Update Risk Regime Dashboard

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
              python -m pip install --upgrade pip
              if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
              pip install "pandas<3.0.0" pandas-datareader plotly yfinance
            
    - name: Run US risk regime analysis
      run: |
        python generate_us.py
        
    - name: Run China growth regime analysis
      run: |
        python generate_china.py
        
    - name: Push to boquin.github.io
      run: |
        git clone https://x-access-token:${{ secrets.BOQUIN_DEPLOY_TOKEN }}@github.com/DataVizHonduran/boquin.github.io.git _boquin
        mkdir -p _boquin/reports/risk-regimes
        cp us_regime.html china_growth.html us_regime_data.json china_growth_data.json _boquin/reports/risk-regimes/
        cd _boquin
        git config user.email "action@github.com"
        git config user.name "GitHub Action"
        git add reports/risk-regimes/
        git diff --staged --quiet || git commit -m "Update risk regimes - $(date +'%Y-%m-%d')"
        git pull --rebase
        git push
